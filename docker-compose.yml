services:
  genoly:
    build:
      context: .
      dockerfile: Dockerfile
    image: genoly-gpu:latest
    container_name: genoly-gpu
    ports:
      - "8000:8000"
    environment:
      - GENOLY_DEVICE=auto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # =====================================================================
    # ACCELERACIÓN GPU (opcional, requiere nvidia-container-toolkit en el host)
    # ---------------------------------------------------------------------
    # La API funciona sin GPU (PyTorch cae a CPU automáticamente). Para usar
    # la GPU NVIDIA dentro del contenedor, descomenta el bloque deploy:
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    #
    # En Windows/WSL2 instala el toolkit dentro de la distro WSL:
    #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
    # =====================================================================